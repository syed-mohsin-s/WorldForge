services:
  worldforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: worldforge:latest
    container_name: worldforge-studio
    ports:
      - "8000:8000"
    environment:
      - BASETEN_API_KEY=${BASETEN_API_KEY:-}
      - META_API_KEY=${META_API_KEY:-}
      - MUJOCO_GL=${MUJOCO_GL:-osmesa}
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist generated MP4 rollouts, mask images, and synthesized MJCF XMLs
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional decoupled development service for frontend hot-reloading
  frontend-dev:
    image: node:20-slim
    container_name: worldforge-frontend-dev
    profiles: ["dev"]
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - worldforge
